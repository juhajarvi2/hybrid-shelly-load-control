        - switch.shellypro2_ec626088bcb0_output_1
  conditions: []
  actions:
    - action: telegram_bot.send_message
      data:
        entity_id:
          - notify.shelly_juha_jarvi_8260789652
        message:
          "Lattialämmitys: {{ 'päällä' if is_state('switch.shellypro2_ec626088bcb0_output_1',
