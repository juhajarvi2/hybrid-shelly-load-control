# ============================================================
# Home Assistant – automaatiot
# Shelly Pro 2 (varaaja = output_0, lattia = output_1)
# Shelly Pro 3 EM (192.168.3.27, MAC 14335cc59f6c) mittaus
#
# Kuormanohjauksen kokonaisuus:
#   - Shelly-skripti (aurinko-ohjaus.js) hoitaa aurinko-ohjauksen,
#     ilta-/aamunollauksen ja absoluuttisen turvarajan (5750 W/vaihe)
#   - Pörssäri (HA) kytkee kuormat halvoille tunneille (22:00–07:00)
#   - Palautusautomaatiot kytkevät kuorman takaisin, jos turvalogiikka
#     sammutti sen mutta pörssäri haluaa sen yhä päälle ja vaihekuorma
#     on laskenut turvalliselle tasolle
#
# Palautusrajat ovat kuormakohtaiset (per vaihe):
#   varaaja < 4500 W  (varaaja lisää ~1 kW/vaihe → 5750−1000−250)
#   lattia  < 4000 W  (lattia lisää ~2,5 kW/vaihe; raja pitää
#                      huippukuorman turvarajan tuntumassa)
# ============================================================

- id: "1774072057097"
  alias: Viesti
  description: ""
  triggers:
    - trigger: state
      entity_id:
        - switch.shellypro2_ec626088bcb0_output_0
        - switch.shellypro2_ec626088bcb0_output_1
  conditions: []
  actions:
    - action: telegram_bot.send_message
      metadata: {}
      data:
        message:
          "{{ trigger.to_state.attributes.friendly_name }} on nyt {{ trigger.to_state.state
          }}"
  mode: single

- id: "1774541995478"
  alias: Lattia_pois
  description: ""
