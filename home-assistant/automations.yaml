      trigger: device
      to: cool
  conditions: []
  actions:
    - type: turn_off
      device_id: f759a795c1e044e94db06f84ff016e61
      entity_id: 4a94c59c08d1fd33b85e3553cc6b53bc
      domain: switch
  mode: single

- id: "1774553175506"
  alias: Lattia_pois_automaatio_loppuu
  description: ""
  triggers:
    - device_id: b398d0ce8be7c0c43f1120abded60100
      domain: climate
      entity_id: bb4e5c03484c9fed9ae1929412494406
      type: hvac_mode_changed
      trigger: device
      to: heat
  conditions: []
  actions:
    - type: turn_on
      device_id: f759a795c1e044e94db06f84ff016e61
      entity_id: 4a94c59c08d1fd33b85e3553cc6b53bc
      domain: switch
  mode: single

- id: "1774641492197"
  alias: Uusi automaatio_varaaja
  description: ""
  triggers:
    - trigger: state
      entity_id:
        - switch.shellypro2_ec626088bcb0_output_0
  conditions: []
  actions:
    - action: telegram_bot.send_message
      data:
        entity_id:
          - notify.shelly_juha_jarvi_8260789652
