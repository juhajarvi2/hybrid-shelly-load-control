- id: "1777130993923"
  alias: Ilmastointi_lämpötilan_mukaan
  description:
    Cool päälle yli 25°C, heat takaisin alle 24°C, ei jäähdytetä jos takka
    päällä
  triggers:
    - type: temperature
      device_id: f07399bec9a50f4d1c4f9e170164132a
      entity_id: 26e633682250e17529fbca893b9be50c
      domain: sensor
      trigger: device
      above: 25
      for:
        minutes: 3
      id: liian_kuuma
    - type: temperature
      device_id: f07399bec9a50f4d1c4f9e170164132a
      entity_id: 26e633682250e17529fbca893b9be50c
      domain: sensor
      trigger: device
      below: 24
      for:
        minutes: 3
      id: tarpeeksi_viilea
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: liian_kuuma
            - condition: state
              entity_id: input_boolean.takka_paalla
              state: "off"
          sequence:
            - device_id: b398d0ce8be7c0c43f1120abded60100
              domain: climate
              entity_id: bb4e5c03484c9fed9ae1929412494406
              type: set_hvac_mode
              hvac_mode: cool
            - action: telegram_bot.send_message
              data:
                entity_id:
                  - notify.mitsubishi_juha_jarvi
                message: "Jäähdytys päälle: olohuone ylitti 25°C.

                  "
        - conditions:
            - condition: trigger
              id: tarpeeksi_viilea
            - condition: device
              device_id: b398d0ce8be7c0c43f1120abded60100
              domain: climate
              entity_id: bb4e5c03484c9fed9ae1929412494406
              type: is_hvac_mode
              hvac_mode: cool
          sequence:
            - device_id: b398d0ce8be7c0c43f1120abded60100
              domain: climate
              entity_id: bb4e5c03484c9fed9ae1929412494406
              type: set_hvac_mode
              hvac_mode: heat
            - action: telegram_bot.send_message
              data:
                entity_id:
                  - notify.mitsubishi_juha_jarvi
                message: "Lämmitys takaisin: olohuone alitti 24°C.

                  "
  mode: single

- id: cbfa449374f547f7911ef9b6a85175bb
  alias: Pörssäri HA - Varaaja ohjaus
  description: Ohjaa Shelly Pro 2 output 0 (varaaja) HA:n pörssäri-sensorin perusteella
  triggers:
    - trigger: state
      entity_id: sensor.porssari_channel_1_state
      to: "1"
      id: kytke_paalle
    - trigger: state
      entity_id: sensor.porssari_channel_1_state
      to: "0"
      id: kytke_pois
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: kytke_paalle
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.shellypro2_ec626088bcb0_output_0
        - conditions:
            - condition: trigger
              id: kytke_pois
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.shellypro2_ec626088bcb0_output_0
  mode: single

- id: 87c4a2cc058943bdb34d7197793d5427
  alias: Pörssäri HA - Lattia ohjaus
  description: Ohjaa Shelly Pro 2 output 1 (lattia) HA:n pörssäri-sensorin perusteella
  triggers:
    - trigger: state
      entity_id: sensor.porssari_channel_2_state
      to: "1"
      id: kytke_paalle
    - trigger: state
      entity_id: sensor.porssari_channel_2_state
      to: "0"
      id: kytke_pois
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: kytke_paalle
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.shellypro2_ec626088bcb0_output_1
        - conditions:
            - condition: trigger
              id: kytke_pois
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.shellypro2_ec626088bcb0_output_1
  mode: single

- id: 1d583d7301e34500bb09f53244f72cb4
  alias: Pörssäri HA - Lattia palautus Elenia-suojan jälkeen
  description: Palauttaa lattian jos suoja sammutti sen mutta pörssäri haluaa sen yhä päällä ja vaihe on vapautunut
  triggers:
    - trigger: time_pattern
      minutes: "/15"
  conditions:
    - condition: state
      entity_id: sensor.porssari_channel_2_state
      state: "1"
    - condition: state
      entity_id: switch.shellypro2_ec626088bcb0_output_1
      state: "off"
      for:
        minutes: 5
    - condition: numeric_state
      entity_id: sensor.shellypro3em_14335cc59f6c_phase_a_teho
      below: 4000
    - condition: numeric_state
      entity_id: sensor.shellypro3em_14335cc59f6c_phase_b_teho
      below: 4000
    - condition: numeric_state
      entity_id: sensor.shellypro3em_14335cc59f6c_phase_c_teho
      below: 4000
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.shellypro2_ec626088bcb0_output_1
  mode: single

- id: 7020ee9454a14a7fb98315907c55399a
  alias: Pörssäri – Varaajan palautus turvakatkon jälkeen
  description: >
    Palauttaa varaajan, jos turvalogiikka on sammuttanut sen mutta pörssäri
    haluaa sen yhä päälle ja vaihekuorma on laskenut turvalliselle tasolle.
    Varaaja on prioriteettikuorma (lämmin vesi), joten palautusraja on
    korkeampi kuin lattialla: varaaja lisää vain ~1 kW/vaihe.
  triggers:
    - trigger: time_pattern
      minutes: "/15"
  conditions:
    - condition: state
      entity_id: sensor.porssari_channel_1_state
      state: "1"
    - condition: state
      entity_id: switch.shellypro2_ec626088bcb0_output_0
      state: "off"
      for:
        minutes: 5
    - condition: numeric_state
      entity_id: sensor.shellypro3em_14335cc59f6c_phase_a_teho
      below: 4500
    - condition: numeric_state
      entity_id: sensor.shellypro3em_14335cc59f6c_phase_b_teho
      below: 4500
    - condition: numeric_state
      entity_id: sensor.shellypro3em_14335cc59f6c_phase_c_teho
      below: 4500
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.shellypro2_ec626088bcb0_output_0
  mode: single
